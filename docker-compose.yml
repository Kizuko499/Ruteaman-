services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ruteaman
      POSTGRES_USER: ruteaman
      POSTGRES_PASSWORD: ruteaman
    ports:
      - "5432:5432"
    volumes:
      - ruteaman_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ruteaman -d ruteaman"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  ruteaman_pgdata:
